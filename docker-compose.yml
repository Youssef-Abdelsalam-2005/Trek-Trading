services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: trek
      POSTGRES_PASSWORD: trek_dev
      POSTGRES_DB: trek
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trek"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["uvicorn", "trek.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://trek:trek_dev@db:5432/trek
      HOT_WALLET_ADDRESS: ${HOT_WALLET_ADDRESS:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["python", "-m", "trek.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://trek:trek_dev@db:5432/trek
    depends_on:
      db:
        condition: service_healthy

  engine:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["python", "-m", "trek.engine"]
    environment:
      DATABASE_URL: postgresql+asyncpg://trek:trek_dev@db:5432/trek
      HOT_WALLET_ADDRESS: ${HOT_WALLET_ADDRESS:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      BALANCE_CHECK_INTERVAL_SECONDS: ${BALANCE_CHECK_INTERVAL_SECONDS:-300}
      LOW_BALANCE_THRESHOLD_USD: ${LOW_BALANCE_THRESHOLD_USD:-100}
    depends_on:
      db:
        condition: service_healthy

  signer:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["python", "-m", "trek.signer"]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:5173"

volumes:
  pgdata:
