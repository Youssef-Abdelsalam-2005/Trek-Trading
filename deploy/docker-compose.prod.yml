services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    env_file: /etc/trek/db.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trek"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 256mb
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - max_connections=100
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      - -c
      - log_min_duration_statement=500
    deploy:
      resources:
        limits:
          memory: 4G

  sandbox:
    image: trek-sandbox:latest
    runtime: runsc
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp:size=128M,noexec
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    profiles:
      - sandbox

volumes:
  pgdata:
    driver: local
